# Contrôle réutilisable des PR, appelé depuis chaque repo (voir templates/pr-guard.yml).
# Vérifie la branche, le titre, la description et l'issue liée, et ajoute l'étiquette agent-ai aux PR faites par un agent.
name: pr-guard
on:
  workflow_call:

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Étiquette agent-ai
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          ai=false
          printf '%s' "$BODY" | grep -qiE -- '-[[:space:]]*\[x\][[:space:]]*Généré ou modifié par un agent AI' && ai=true
          [[ "$HEAD" == claude/* ]] && ai=true
          if [ "$ai" = false ]; then
            gh api "repos/$REPO/pulls/$NUMBER/commits?per_page=100" --jq '.[].commit | (.message + "\n" + .author.name)' \
              | grep -qiE 'co-authored-by:[[:space:]]*(claude|copilot|codex|cursor)|^(claude|copilot|codex)' && ai=true
          fi
          if [ "$ai" = true ]; then gh api "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=agent-ai" > /dev/null && echo "Étiquette agent-ai ajoutée"; fi

      - name: Vérifier branche, titre, description et issue liée
        env:
          HEAD: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          errors=0
          fail() { echo "::error::$1"; errors=$((errors+1)); }

          # Exceptions : robots (dependabot, release-please)
          if [[ "$AUTHOR" == "dependabot[bot]" || "$HEAD" == dependabot/* ]]; then echo "Dependabot : ignoré"; exit 0; fi
          if [[ "$HEAD" == release-please--* ]]; then echo "release-please : ignoré"; exit 0; fi

          # Promotions entre branches d'environnement : seul le titre est vérifié
          ENV_RE='^(main|master|dev|demo|test|prod|release/[0-9]{4}-[0-9]{2}-[0-9]{2})$'
          if [[ "$HEAD" =~ $ENV_RE && "$BASE" =~ $ENV_RE ]]; then
            echo "Promotion $HEAD -> $BASE : seul le titre est vérifié"
            [[ ${#TITLE} -ge 10 ]] || fail "Titre trop court pour une promotion ($HEAD -> $BASE)."
            exit $errors
          fi

          # 1. Branche
          BR_RE='^((feat|fix|chore|docs|refactor|test|perf|hotfix)/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*|release/[0-9]{4}-[0-9]{2}-[0-9]{2})$'
          [[ "$HEAD" =~ $BR_RE ]] || fail "Branche « $HEAD » hors standard. Attendu : type/no-issue-description (ex. feat/142-filtre-livrables)."

          # 2. Titre
          TI_RE='^(feat|fix|chore|docs|refactor|test|perf|hotfix|build|ci|revert)(\([a-z0-9._/-]+\))?!?: .{5,}$'
          [[ "$TITLE" =~ $TI_RE ]] || fail "Titre « $TITLE » hors standard. Attendu : type(portée): description (#issue)."

          # 3. Sections obligatoires remplies (commentaires HTML retirés)
          CLEAN=$(printf '%s' "$BODY" | perl -0pe 's/<!--.*?-->//gs')
          for s in "Contexte" "Changements" "Comment tester"; do
            content=$(printf '%s\n' "$CLEAN" | awk -v s="## $s" '$0==s{f=1;next} /^## /{f=0} f' | grep -vE '^[[:space:]]*(-|[0-9]+\.)?[[:space:]]*$' || true)
            [[ -n "$content" ]] || fail "Section « $s » vide dans la description."
          done

          # 4. Issue liée
          printf '%s' "$CLEAN" | grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' || fail "Aucune issue liée. Ajoute « Closes #123 » dans la description."

          if [[ $errors -gt 0 ]]; then echo "$errors problème(s). Voir https://github.com/SanimarcInc/.github/blob/main/CONTRIBUTING.md"; exit 1; fi
          echo "PR conforme"
