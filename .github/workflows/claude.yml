# Claude dans les PR et les issues, réutilisable. Appelé depuis chaque repo (voir templates/claude.yml).
# - Revue automatique à l'ouverture d'une PR (et quand une PR brouillon passe prête).
# - Répond quand un membre écrit @claude dans une issue, une PR ou un commentaire de revue.
# Secret requis dans le repo appelant : ANTHROPIC_API_KEY. Sans secret, le job saute sans échouer.
name: claude
on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: false

jobs:
  claude:
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.user.type != 'Bot') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::notice::Secret ANTHROPIC_API_KEY absent : Claude sauté."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - if: steps.key.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Revue automatique d'une PR
      - if: steps.key.outputs.ok == 'true' && github.event_name == 'pull_request'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Fais la revue de code de cette PR. Écris en français, de façon concise et priorisée.
            Vérifie :
            1. Bugs et régressions probables.
            2. Sécurité : secrets ou données réelles commités, injections SQL, failles d'authentification, entrées non validées.
            3. Tests manquants pour le code ajouté ou modifié.
            4. Respect du standard de l'organisation décrit dans AGENTS.md (si présent) : titre et description de PR remplis, issue liée, une PR = un sujet, README et fiche du repo à jour si le but ou la stack change.

            Utilise `mcp__github_inline_comment__create_inline_comment` pour les problèmes précis sur une ligne,
            puis publie UN commentaire de synthèse avec `gh pr comment` : verdict (OK / À corriger), puis la liste des points par gravité.
            Ne signale que des problèmes réels. Pas de compliments ni de remarques de style mineures. Ne modifie aucun fichier.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # Réponse à une mention @claude
      - if: steps.key.outputs.ok == 'true' && github.event_name != 'pull_request'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 30
