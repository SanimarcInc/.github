# Remplit le Kanban « Développement - SanimarcInc » avec les issues et PR de tous les repos.
# Secret requis : ORG_AUTOMATION_TOKEN (token fin, voir README). Sans secret, le job saute sans échouer.
name: project-sync
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Inclure les éléments fermés depuis N jours"
        default: "14"

permissions:
  contents: read

concurrency:
  group: project-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - id: token
        env:
          TOKEN: ${{ secrets.ORG_AUTOMATION_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::notice::Secret ORG_AUTOMATION_TOKEN absent : synchronisation sautée."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.token.outputs.ok == 'true'
        uses: actions/github-script@v7
        env:
          DAYS: ${{ github.event.inputs.days || '2' }}
        with:
          github-token: ${{ secrets.ORG_AUTOMATION_TOKEN }}
          script: |
            const { run } = require('./.github/scripts/project-sync.js');
            const counts = await run(github.graphql, { days: Number(process.env.DAYS) });
            core.info(JSON.stringify(counts));
            if (counts.errors > 0) core.warning(`${counts.errors} élément(s) en erreur`);
