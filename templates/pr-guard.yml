# Contrôle du standard sur chaque PR (branche, titre, description, issue liée) et étiquette agent-ai.
# Logique : https://github.com/SanimarcInc/.github/blob/main/.github/workflows/pr-guard.yml
name: pr-guard
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  pr-guard:
    uses: SanimarcInc/.github/.github/workflows/pr-guard.yml@main
