# Releases automatiques (release-please) à partir des Conventional Commits.
# Logique : https://github.com/SanimarcInc/.github/blob/main/.github/workflows/release.yml
# Secret requis dans ce repo : ORG_AUTOMATION_TOKEN (sans lui, la release est sautée).
name: release
on:
  push:
    branches: [__BASE__]
permissions:
  contents: read
jobs:
  release:
    uses: SanimarcInc/.github/.github/workflows/release.yml@main
    secrets:
      ORG_AUTOMATION_TOKEN: ${{ secrets.ORG_AUTOMATION_TOKEN }}
